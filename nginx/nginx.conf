user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    upstream app {
        server app:8080;
    }

    # Фронтенд живёт в отдельном compose-проекте и опубликован на хосте на 8080
    upstream front {
        server host.docker.internal:8080;
    }

    # HTTP: только ACME-челлендж для certbot и редирект на HTTPS
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://startlift.duckdns.org$request_uri;
        }
    }

    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  startlift.duckdns.org;

        # Сертификат Let's Encrypt выпускает и продлевает certbot на хосте
        ssl_certificate      /etc/letsencrypt/live/startlift.duckdns.org/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/startlift.duckdns.org/privkey.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;

        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 50m;

        gzip on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json image/svg+xml;

        location /api/ {
            proxy_pass         http://app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass         http://front;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
