databaseChangeLog:
  - changeSet:
      id: 0014-01
      author: loonklage
      changes:
        - createTable:
            tableName: talk_feedback
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: talk_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: rating
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: positive
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: negative
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: improvement_suggestions
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: talk_feedback
            baseColumnNames: talk_id
            referencedTableName: talks
            referencedColumnNames: id
            constraintName: fk_talk_feedback_talks_talk_id
            onDelete: CASCADE
        - sql:
            sql: |
              ALTER TABLE talk_feedback ADD CONSTRAINT chk_talk_feedback_rating
                CHECK (rating >= 0 AND rating <= 10);
        - createIndex:
            tableName: talk_feedback
            indexName: idx_talk_feedback_talk_id
            columns:
              - column:
                  name: talk_id
