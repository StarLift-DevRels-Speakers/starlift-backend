databaseChangeLog:
  - changeSet:
      id: 0017-01
      author: producer
      comment: >-
        Сиды 0006 вставили users с явными id 1–3, не сдвинув счётчик, поэтому первая вставка без id падала на дубликате.
        Сдвигаем счётчик только вперёд.
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                seq text := pg_get_serial_sequence('users', 'id');
                max_id bigint;
                current_value bigint;
              BEGIN
                SELECT MAX(id) INTO max_id FROM users;
                IF seq IS NULL OR max_id IS NULL THEN
                  RETURN;
                END IF;
                SELECT last_value INTO current_value FROM pg_sequences
                  WHERE schemaname || '.' || sequencename = seq;
                IF current_value IS NULL OR current_value < max_id THEN
                  PERFORM setval(seq, max_id);
                END IF;
              END$$;

