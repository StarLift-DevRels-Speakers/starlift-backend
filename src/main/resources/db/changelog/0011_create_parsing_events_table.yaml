databaseChangeLog:
  - changeSet:
      id: 0011
      author: loonklage
      changes:
        - createTable:
            tableName: parsing_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: conference
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: speaker_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: company
                  type: VARCHAR(255)
              - column:
                  name: source_url
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: event_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: region
                  type: VARCHAR(100)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: speaker_id
                  type: BIGINT
              - column:
                  name: note
                  type: TEXT
              - column:
                  name: dedup_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: parsing_events
            baseColumnNames: speaker_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_parsing_events_users_speaker_id
            onDelete: SET NULL
        - createIndex:
            indexName: idx_parsing_events_dedup
            tableName: parsing_events
            unique: true
            columns:
              - column:
                  name: dedup_key
        - createIndex:
            indexName: idx_parsing_events_event_date
            tableName: parsing_events
            columns:
              - column:
                  name: event_date
        - createIndex:
            indexName: idx_parsing_events_status
            tableName: parsing_events
            columns:
              - column:
                  name: status
