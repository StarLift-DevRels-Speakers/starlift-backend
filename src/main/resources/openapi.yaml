    get:
      tags: [Producer]
      summary: HTML-отчёт по последним планам спикеров (DEVREL, ADMIN)
      operationId: getProducerReport
      description: Сводка, планы с доказательствами, сверка демо-спикеров с эталоном и всё, что отбросил валидатор.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: HTML-страница
          content:
            text/html:
              schema:
                type: string

  # ── Weak signals ────────────────────────────────────────────────────

  /api/signals/speakers/{speakerId}/talent-score:
