      description: WEEK — баллы текущей недели по всем лигам, ALL_TIME — накопленный опыт.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [WEEK, ALL_TIME]
            default: ALL_TIME
        - $ref: '#/components/parameters/GamificationLimit'
      responses:
        '200':
          description: Рейтинг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalLeaderboardResponse'

  /api/gamification/badges:
    get:
      tags: [Gamification]
      summary: Справочник значков (наград)
      operationId: listBadges
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Значки
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BadgeDefinitionResponse'

  /api/gamification/seasons:
    get:
      tags: [Gamification]
      summary: Сезоны (недели), новые первыми
      operationId: listSeasons
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GamificationLimit'
      responses:
        '200':
          description: Сезоны
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeasonResponse'

  /api/gamification/seasons/current:
    get:
      tags: [Gamification]
      summary: Текущий сезон
      operationId: getCurrentSeason
      description: Создаётся автоматически при первом обращении в новой неделе.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Сезон
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'

  /api/gamification/seasons/current/close:
    post:
      tags: [Gamification]
      summary: Досрочно закрыть текущий сезон (DEVREL, ADMIN)
      operationId: closeCurrentSeason
      description: >-
        Подводит итоги: топ лиги повышается, низ понижается, выдаются значки. Следующий сезон
        начинается сразу и длится до ближайшего понедельника. В обычном режиме сезоны закрывает
        шедулер (app.gamification.close-cron).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Итоги закрытия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonCloseResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/gamification/seasons/{seasonId}/results:
    parameters:
      - name: seasonId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Gamification]
      summary: Итоги закрытого сезона
      operationId: getSeasonResults
      security:
        - bearerAuth: []
      parameters:
        - name: league
          in: query
          required: false
          description: Только участники этой лиги (лига на момент сезона)
          schema:
            $ref: '#/components/schemas/LeagueCode'
      responses:
        '200':
          description: Итоги по лигам, внутри лиги — по месту
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeasonResultResponse'
        '404':
          description: Сезон не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Сезон ещё не закрыт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Producer · Организатор: мероприятие → спикеры ───────────────────

  /api/producer/events:
    post:
      tags: [Producer · Организатор]
      summary: Описать мероприятие текстом или формой — ИИ разберёт параметры и задаст уточняющие вопросы
      operationId: createProducerEvent
      description: >-
        Модель выписывает из описания параметры с цитатой: confirmed — сказано прямо или указано организатором,
        inferred — вывод ИИ по контексту, unknown — данных нет (значение не подставляется). Значение без точной
        цитаты из описания отбрасывается. Вопросы задаются только по критичным неизвестным параметрам.
        Если описание разобрать не удалось, карточка собирается из полей формы.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Карточка мероприятия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCard'
        '400':
          description: Пустой запрос или неизвестный параметр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Нужна роль DEVREL или ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      tags: [Producer · Организатор]
      summary: Мои мероприятия
      operationId: listProducerEvents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Мероприятия организатора (ADMIN видит все)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventListItem'

  /api/producer/events/{id}:
    parameters:
      - $ref: '#/components/parameters/ProducerEventId'
    get:
      tags: [Producer · Организатор]
      summary: Карточка мероприятия
      operationId: getProducerEvent
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCard'
        '403':
          description: Мероприятие другого организатора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      tags: [Producer · Организатор]
      summary: Ответить на уточняющие вопросы или изменить требования
      operationId: updateProducerEvent
      description: >-
        Ответ на вопрос делает параметр подтверждённым. Пропуск вопроса не останавливает подбор, но снижает
        уверенность. После изменений карточка показывает, что поменялось с прошлого подбора.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Обновлённая карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCard'

  /api/producer/events/{id}/match:
    parameters:
      - $ref: '#/components/parameters/ProducerEventId'
    post:
      tags: [Producer · Организатор]
      summary: Подобрать спикеров под мероприятие
      operationId: matchProducerEventSpeakers
      description: >-
        Многофакторный подбор: подтверждённый опыт (доклады) важнее заявленного, свежий важнее старого, отзывы
        учитываются только по докладам на темы мероприятия. Кандидат, не выполнивший обязательное требование,
        исключается с причиной. Каждая рекомендация — с объяснением, ограничениями, недостающими данными и
        уверенностью. aiSummary — короткий пересказ от модели, есть, только если прошёл проверку по фактам.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Кандидаты по группам релевантности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerMatchResult'
    get:
      tags: [Producer · Организатор]
      summary: Последний подбор по мероприятию
      operationId: getProducerEventMatch
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Последний результат подбора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerMatchResult'
        '404':
          description: Подбор ещё не запускался
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/producer/events/{id}/candidates/{expertId}/actions:
    parameters:
      - $ref: '#/components/parameters/ProducerEventId'
      - name: expertId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Producer · Организатор]
      summary: Действие с кандидатом — shortlist, приглашение, «не подходит», выступление состоялось
      operationId: producerCandidateAction
      description: >-
        Всё сохраняется в историю как факт. Приглашение того, кто уже выступал у этого организатора, дополнительно
        записывается как повторное приглашение. «Выступление состоялось» — только после принятого приглашения.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateActionRequest'
      responses:
        '200':
          description: Действие записано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateActionResponse'
        '409':
          description: Действие не по порядку (например, повторное приглашение до ответа)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/producer/events/{id}/cfp:
    parameters:
      - $ref: '#/components/parameters/ProducerEventId'
    post:
      tags: [Producer · Организатор]
      summary: Открыть CFP мероприятия — оно появится в подборе мероприятий у спикеров
      operationId: publishProducerEventCfp
      description: Поля CFP берутся из карточки мероприятия; в требования попадают только явно обязательные.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CfpPublishRequest'
      responses:
        '200':
          description: CFP открыт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfpPublishResponse'

  /api/producer/events/{id}/history:
    parameters:
      - $ref: '#/components/parameters/ProducerEventId'
    get:
      tags: [Producer · Организатор]
      summary: История по мероприятию — рекомендации ИИ и действия людей
      operationId: getProducerEventHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: От новых к старым; kind = fact — действие человека, kind = ai — рекомендация ИИ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryItem'

  /api/producer/metrics:
    get:
      tags: [Producer · Организатор]
      summary: Метрики качества — воронки от рекомендации до выступления и заявки (DEVREL, ADMIN)
      operationId: getProducerMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Воронки и доли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerMetrics'

  # ── Producer · Спикер: эксперт → мероприятия и CFP ──────────────────

  /api/producer/me/profile:
    get:
      tags: [Producer · Спикер]
      summary: Мой профиль эксперта — подтверждённая, возможная и смежная экспертиза и чего не хватает
      operationId: getMyExpertProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpertProfile'

  /api/producer/me/preferences:
    put:
      tags: [Producer · Спикер]
      summary: Мои предпочтения — языки, форматы, онлайн или офлайн, интересы
      operationId: saveMyExpertPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesRequest'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpertProfile'

  /api/producer/me/events:
    post:
      tags: [Producer · Спикер]
      summary: Подобрать мне мероприятия и открытые CFP
      operationId: recommendMyEvents
      description: >-
        По реальной экспертизе, а не по должности. Требования CFP берутся только из источника: чего там нет,
        перечислено в unknowns. Критическое несоответствие (язык, офлайн в другом городе) не даёт уверенной рекомендации.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Мероприятия по группам релевантности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRecommendationResult'

  /api/producer/me/events/{cfpId}/actions:
    parameters:
      - name: cfpId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Producer · Спикер]
      summary: Отметить действие с мероприятием — посмотрел, открыл CFP, подал заявку, не подходит
      operationId: myEventAction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventActionRequest'
      responses:
        '200':
          description: Действие записано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'

  /api/producer/me/invitations:
    get:
      tags: [Producer · Спикер]
      summary: Мои приглашения — от кого, почему позвали меня и статус
      operationId: getMyInvitations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Приглашения, свежие первыми
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationView'

  /api/producer/me/invitations/{eventId}/response:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Producer · Спикер]
      summary: Ответить на приглашение — принять, отклонить или попросить уточнение
      operationId: respondToInvitation
      description: Отказ сохраняется как факт, но в будущих подборах не считается негативом.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationResponseRequest'
      responses:
        '200':
          description: Приглашение с новым статусом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationView'
        '404':
          description: Приглашения на это мероприятие нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  parameters:
    ProducerEventId:
      name: id
      in: path
      required: true
      description: id мероприятия организатора
      schema:
        type: string
        format: uuid
    TalkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TalkPathTalkId:
      name: talkId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TalkFeedbackId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LectureId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RoleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    SpeakerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    MediaLectureId:
      name: lectureId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    GamificationSpeakerId:
      name: speakerId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    GamificationLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Auth / User ─────────────────────────────────────────────────

    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Уникальный идентификатор пользователя (логин)
          example: johndoe
        password:
          type: string
          format: password
          example: secret123
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          nullable: true
          example: Doe
        surName:
          type: string
          nullable: true
          example: Smith

    RoleName:
      type: string
      enum: [ADMIN, DEVREL, SPEAKER, USER]

    AuthResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: johndoe
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          nullable: true
          example: Doe
        surName:
          type: string
          nullable: true
          example: Smith
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        createdDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time

    AuthTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access-токен
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: Время жизни access в секундах
        refreshToken:
          type: string
        refreshTokenExpiresIn:
          type: integer
          format: int64
          description: Время жизни refresh в секундах
        user:
          $ref: '#/components/schemas/AuthResponse'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UserRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'

    UserRoleUpdateResponse:
      type: object
      required: [userId, roles]
      properties:
        userId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'

    User:
      type: object
      properties:
        region:
          type: string
        preferences:
          type: [string, 'null']
          description: Предпочитаемые форматы, регионы и аудитория
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: johndoe
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          nullable: true
          example: Doe
        surName:
          type: string
          nullable: true
          example: Smith
        about:
          type: string
          nullable: true
          example: Java backend developer and conference speaker
        company:
          type: string
          nullable: true
          example: Acme Corp
        companyRole:
          type: string
          nullable: true
          example: Senior Java Engineer
        tags:
          type: array
          items:
            type: string
          example: [java, spring, architecture]
        avatarUrl:
          type: string
          nullable: true
          format: uri
          description: Временная presigned ссылка на аватар в MinIO
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        createdDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time

    # ── Profile ─────────────────────────────────────────────────────

    MeResponse:
      type: object
      properties:
        me:
          $ref: '#/components/schemas/User'
        talks:
          type: array
          items:
            $ref: '#/components/schemas/MeTalkDto'
        cities:
          type: array
          uniqueItems: true
          items:
            type: string
          example: [Не указан]

    ProfilePatchRequest:
      type: object
      additionalProperties: false
      properties:
        region:
          type: string
          description: Город или регион; пустое значение не меняет текущий
        preferences:
          type: string
          description: Предпочитаемые форматы, регионы и аудитория
        firstName:
          type: [string, 'null']
          example: John
        lastName:
          type: [string, 'null']
          example: Doe
        surName:
          type: [string, 'null']
          example: Smith
        about:
          type: [string, 'null']
          example: Java backend developer and conference speaker
        company:
          type: [string, 'null']
          example: Acme Corp
        companyRole:
          type: [string, 'null']
          example: Senior Java Engineer
        tags:
          type: [array, 'null']
          items:
            type: string
          example: [java, spring, architecture]
        avatarMediaKey:
          type: [string, 'null']
          writeOnly: true
          description: Input-only ключ объекта в MinIO, полученный после загрузки

    MeTalkDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        topic:
          type: string
        talkDate:
          type: string
          format: date-time
        conferenceType:
          type: string
        format:
          type: string
        activityName:
          type: string
        activityDate:
          type: string
          format: date-time
        createdDate:
          type: string
          format: date-time

    # ── Talks ───────────────────────────────────────────────────────

    TalkCreateRequest:
      type: object
      required: [speakerId, topic, talkDate, conferenceType, format]
      properties:
        speakerTalkId:
          type: [string, 'null']
          format: uuid
          description: Заготовка доклада спикера, с которой он выступил
        speakerId:
          type: integer
          format: int64
          example: 1
        topic:
          type: string
          example: "Виртуальные потоки в Java 25"
        talkDate:
          type: string
