      summary: Оценить потенциал спикера (DEVREL, ADMIN)
      operationId: scoreSpeakerTalent
      description: Собирает данные спикера из базы и отправляет их в weak-signals (POST /signals/weak-signals). Результат не сохраняется.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Оценка спикера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalentScoreResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: Сервис weak-signals недоступен, вернул ошибку или отклонил запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '504':
          description: Сервис weak-signals не ответил за app.weak-signals.request-timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/signals/speakers/{speakerId}/talent-request:
    parameters:
      - name: speakerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [WeakSignals]
      summary: Данные, которые уйдут в weak-signals (DEVREL, ADMIN)
      operationId: previewSpeakerTalentRequest
      description: Тело запроса к weak-signals без вызова LLM. null — данных в базе нет; avg_rating без отзывов — 0, achievements_progress_pct без целей — случайная заглушка.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalentRequest'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

