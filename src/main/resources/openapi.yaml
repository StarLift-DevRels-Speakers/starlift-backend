    # ── Producer · подбор ───────────────────────────────────────────

    EventCreateRequest:
      type: object
      description: Хотя бы одно из полей title, description или params.
      example:
        title: Mobile Day
        description: >-
          Ищем спикеров на митап Mobile Day в Москве 20 ноября. Тема — мобильная разработка и продуктовая
          аналитика мобильных приложений. Аудитория — опытные мобильные разработчики и продакт-менеджеры.
          Нужен практический доклад на 30 минут на русском языке. Спикер обязательно должен иметь опыт
          в мобильной разработке.
      properties:
        title:
          type: string
          example: Mobile Day
        description:
          type: string
          description: Описание в свободной форме — ИИ выпишет из него параметры
          example: >-
            Ищем спикеров на митап Mobile Day в Москве 20 ноября. Тема — мобильная разработка и продуктовая
            аналитика мобильных приложений. Аудитория — опытные мобильные разработчики и продакт-менеджеры.
            Нужен практический доклад на 30 минут на русском языке. Спикер обязательно должен иметь опыт
            в мобильной разработке.
        params:
          type: object
          description: >-
            Поля формы, ключи — параметры карточки: topics, subtopics, audience, audienceLevel, goal, industry,
            eventFormat, talkType, talkDuration, attendance, city, language, date, speakerRequirements, constraints, wishes
          additionalProperties:
            type: array
            items:
              type: string
          example: {}
        tags:
          type: array
          items:
            type: string
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/CriterionRequest'

    CriterionRequest:
      type: object
      properties:
        text:
          type: string
          example: Опыт в мобильной аналитике
        kind:
          type: string
          enum: [mandatory, desirable]
        check:
          type: string
          enum: [language, city, attendance, competency, industry, topic, format, audience, other]
        value:
          type: string
          example: мобильная аналитика

    EventUpdateRequest:
      type: object
      description: null — поле не меняется
      example:
        answers:
          attendance: только офлайн
          audienceLevel: опытные
        skip: [talkType]
      properties:
        title:
          type: string
        description:
          type: string
          description: Новое описание разбирается заново
        params:
          type: object
          description: Пустой список очищает параметр
          additionalProperties:
            type: array
            items:
              type: string
        answers:
          type: object
          description: Ответы на уточняющие вопросы, ключ — key вопроса
          additionalProperties:
            type: string
          example:
            attendance: только офлайн
            audienceLevel: опытные
        skip:
          type: array
          description: Пропущенные вопросы
          items:
            type: string
          example: [speakerRequirements]
        addCriteria:
          type: array
          items:
            $ref: '#/components/schemas/CriterionRequest'
        removeCriteria:
          type: array
          description: id требований
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    EventCard:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
          enum: [analyzed, matched]
        summary:
          type: array
          description: Параметры одной строкой — значение и откуда оно (подтверждено, вывод ИИ по описанию, неизвестно)
          items:
            type: string
          example:
