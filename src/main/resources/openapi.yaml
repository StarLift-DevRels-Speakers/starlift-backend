  # ── Media ───────────────────────────────────────────────────────────

  /api/media/upload:
    post:
      tags: [Media]
      summary: Загрузить медиафайл без привязки к лекции
      operationId: uploadStandaloneMedia
      security:
        - bearerAuth: []
      parameters:
        - name: talkId
          in: query
          required: false
          description: Заготовка доклада текущего спикера, к которой относится файл
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Загружаемый файл
      responses:
        '201':
          description: Файл загружен, создана запись с идентификатором и ключом MinIO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMediaUploadResponse'
        '400':
          description: Ошибка загрузки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/media/upload/{lectureId}:
    post:
      tags: [Media]
      summary: Загрузить медиафайл для лекции
      operationId: uploadMedia
      parameters:
        - $ref: '#/components/parameters/MediaLectureId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Загружаемый файл
      responses:
        '201':
          description: Медиафайл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureResponse'
        '400':
