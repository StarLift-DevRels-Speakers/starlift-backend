openapi: 3.1.0
info:
  title: Java Speaker Club API
  description: API для управления докладами, лекциями, ролями и медиафайлами спикеров
  version: 2.0.0

servers:
  - url: https://douspeak.duckdns.org:444
    description:

tags:
  - name: Auth
    description: Регистрация и аутентификация
  - name: Profile
    description: Профиль текущего пользователя
  - name: Talks
    description: Управление докладами
  - name: TalkFeedback
    description: Обратная связь по докладам
  - name: Lectures
    description: Управление лекциями
  - name: Roles
    description: Управление ролями спикеров
  - name: Speakers
    description: Поиск спикеров и управление NPS
  - name: Media
    description: Загрузка медиа (в т.ч. без привязки к лекции), скачивание и удаление файлов лекций
  - name: Users
    description: Администрирование ролей пользователей
  - name: Producer
    description: ИИ-продюсер спикера — персональный план по отзывам, докладам и CFP с проверяемыми доказательствами

paths:

  # ── Auth ────────────────────────────────────────────────────────────

  /api/auth/sign-on:
    post:
      tags: [Auth]
      summary: Регистрация нового пользователя
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Пользователь зарегистрирован и получил токены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          description: Ошибка регистрации (например, username уже занят)

  /api/auth/sign-in:
    post:
      tags: [Auth]
      summary: Аутентификация пользователя
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Неверные учётные данные

  /api/auth/roles:
    get:
      tags: [Auth]
      summary: Получить список всех доступных ролей
      operationId: listRoles
      responses:
        '200':
          description: Список ролей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleName'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Выход из системы
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh-токен отозван
        '401':
          description: Недействительный refresh-токен

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Обновить пару access/refresh токенов
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Токены обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Refresh-токен недействителен или отозван

  # ── Profile ─────────────────────────────────────────────────────────

  /api/me:
    get:
      tags: [Profile]
      summary: Профиль текущего аутентифицированного пользователя
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль и доклады пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Пользователь не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      tags: [Profile]
      summary: Частично обновить профиль текущего пользователя
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Пользователь не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/users/{userId}/role:
    patch:
      tags: [Users]
      summary: Заменить роль пользователя на одну указанную
      operationId: replaceUserRole
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequest'
      responses:
        '200':
          description: Роль пользователя обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleUpdateResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Пользователь не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Talks ───────────────────────────────────────────────────────────

  /api/talks:
    get:
      tags: [Talks]
      summary: Список всех докладов
      operationId: findAllTalks
      parameters:
        - name: conferenceType
          in: query
          required: false
          description: Фильтр по типу конференции
          schema:
            type: string
      responses:
        '200':
          description: Список докладов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TalkResponse'

    post:
      tags: [Talks]
      summary: Создать новый доклад
      operationId: createTalk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkCreateRequest'
      responses:
        '201':
          description: Доклад создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '400':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{id}:
    get:
      tags: [Talks]
      summary: Получить доклад по ID
      operationId: findTalkById
      parameters:
        - $ref: '#/components/parameters/TalkId'
      responses:
        '200':
          description: Доклад найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [Talks]
      summary: Обновить доклад
      operationId: updateTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkUpdateRequest'
      responses:
        '200':
          description: Доклад обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    patch:
      tags: [Talks]
      summary: Частично обновить доклад
      operationId: patchTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkUpdateRequest'
      responses:
        '200':
          description: Доклад обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [Talks]
      summary: Удалить доклад
      operationId: deleteTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
      responses:
        '204':
          description: Доклад удалён
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{id}/tags:
    post:
      tags: [Talks]
      summary: Добавить теги докладу
      operationId: addTalkTags
      parameters:
        - $ref: '#/components/parameters/TalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkTagsAddRequest'
      responses:
        '200':
          description: Доклад обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{id}/tags/{tag}:
    delete:
      tags: [Talks]
      summary: Удалить тег доклада
      operationId: deleteTalkTag
      parameters:
        - $ref: '#/components/parameters/TalkId'
        - name: tag
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Доклад обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{talkId}/feedback:
    get:
      tags: [TalkFeedback]
      summary: Список обратной связи по докладу
      operationId: findTalkFeedbackByTalkId
      parameters:
        - $ref: '#/components/parameters/TalkPathTalkId'
      responses:
        '200':
          description: Список обратной связи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TalkFeedbackResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    post:
      tags: [TalkFeedback]
      summary: Добавить обратную связь по докладу
      operationId: createTalkFeedback
      parameters:
        - $ref: '#/components/parameters/TalkPathTalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkFeedbackCreateRequest'
      responses:
        '201':
          description: Обратная связь создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkFeedbackResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{talkId}/feedback/{id}:
    get:
      tags: [TalkFeedback]
      summary: Получить обратную связь по ID в рамках доклада
      operationId: findTalkFeedbackById
      parameters:
        - $ref: '#/components/parameters/TalkPathTalkId'
        - $ref: '#/components/parameters/TalkFeedbackId'
      responses:
        '200':
          description: Обратная связь найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkFeedbackResponse'
        '404':
          description: Доклад или обратная связь не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Lectures ────────────────────────────────────────────────────────

  /api/lectures/by-talk/{talkId}:
    get:
      tags: [Lectures]
      summary: Лекции по ID доклада
      operationId: findLecturesByTalkId
      parameters:
        - name: talkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список лекций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LectureResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/lectures/by-speaker/{speakerId}:
    get:
      tags: [Lectures]
      summary: Лекции по ID спикера
      operationId: findLecturesBySpeakerId
      parameters:
        - name: speakerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Список лекций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LectureResponse'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/lectures/{id}:
    get:
      tags: [Lectures]
      summary: Получить лекцию по ID
      operationId: findLectureById
      parameters:
        - $ref: '#/components/parameters/LectureId'
      responses:
        '200':
          description: Лекция найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureResponse'
        '404':
          description: Лекция не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [Lectures]
      summary: Обновить лекцию
      operationId: updateLecture
      parameters:
        - $ref: '#/components/parameters/LectureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LectureUpdateRequest'
      responses:
        '200':
          description: Лекция обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureResponse'
        '404':
          description: Лекция не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [Lectures]
      summary: Удалить лекцию
      operationId: deleteLecture
      parameters:
        - $ref: '#/components/parameters/LectureId'
      responses:
        '204':
          description: Лекция удалена
        '404':
          description: Лекция не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/lectures:
    post:
      tags: [Lectures]
      summary: Создать лекцию
      operationId: createLecture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LectureCreateRequest'
      responses:
        '201':
          description: Лекция создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureResponse'
        '400':
          description: Доклад или спикер не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Roles ───────────────────────────────────────────────────────────

  /api/roles:
    get:
      tags: [Roles]
      summary: Список всех ролей
      operationId: findAllRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список ролей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'

    post:
      tags: [Roles]
      summary: Создать роль
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201':
          description: Роль создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Спикер не найден или роль уже назначена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/roles/by-speaker/{speakerId}:
    get:
      tags: [Roles]
      summary: Роли спикера по его ID
      operationId: findRolesBySpeakerId
      security:
        - bearerAuth: []
      parameters:
        - name: speakerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Список ролей спикера
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'

  /api/roles/{id}:
    delete:
      tags: [Roles]
      summary: Удалить роль
      operationId: deleteRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: Роль удалена
        '404':
          description: Роль не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Speakers ────────────────────────────────────────────────────────

  /api/speakers:
    get:
      tags: [Speakers]
      summary: Поиск спикеров по роли и NPS
      operationId: findSpeakersByRole
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          description: Фильтр по названию роли
          schema:
            type: string
        - name: npsMin
          in: query
          required: false
          description: Минимальное значение NPS
          schema:
            type: number
            format: decimal
        - name: npsMax
          in: query
          required: false
          description: Максимальное значение NPS
          schema:
            type: number
            format: decimal
      responses:
        '200':
          description: Список спикеров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpeakerResponse'

  /api/speakers/{id}:
    get:
      tags: [Speakers]
      summary: Получить спикера по ID
      operationId: findSpeakerById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      responses:
        '200':
          description: Спикер найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerResponse'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/speakers/{id}/nps:
    put:
      tags: [Speakers]
      summary: Обновить NPS спикера
      operationId: updateNps
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NpsUpdateRequest'
      responses:
        '200':
          description: NPS обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerResponse'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/speakers/{id}/dashboard-profile:
    patch:
      tags: [Speakers]
      summary: Обновить dashboard-профиль спикера
      description: SPEAKER может обновлять только свой профиль. DEVREL/ADMIN — любой.
      operationId: patchSpeakerDashboardProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakerDashboardProfilePatchRequest'
      responses:
        '200':
          description: Dashboard-профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerDashboardProfileResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/speakers/{id}/nps-history:
    post:
      tags: [Speakers]
      summary: Добавить запись в историю NPS
      description: SPEAKER может добавлять историю только себе. DEVREL/ADMIN — любому спикеру.
      operationId: createSpeakerNpsHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakerNpsHistoryCreateRequest'
      responses:
        '201':
          description: Запись истории создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerNpsHistoryResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/speakers/{id}/achievements:
    put:
      tags: [Speakers]
      summary: Заменить набор достижений спикера
      description: SPEAKER может изменять только свои достижения. DEVREL/ADMIN — любого спикера.
      operationId: replaceSpeakerAchievements
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SpeakerAchievementUpsertRequest'
      responses:
        '200':
          description: Список достижений после replace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpeakerAchievementResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/speakers/{id}/cfp-recommendations:
    put:
      tags: [Speakers]
      summary: Заменить привязки спикера к CFP рекомендациям
      description: SPEAKER может изменять только свои привязки. DEVREL/ADMIN — любого спикера.
      operationId: replaceSpeakerCfpRecommendations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SpeakerCfpLinkUpsertRequest'
      responses:
        '200':
          description: Привязки обновлены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpeakerCfpLinkResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/cfp/recommendations:
    get:
      tags: [CFP]
      summary: Получить список CFP рекомендаций
      operationId: findAllCfpRecommendations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список рекомендаций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CfpRecommendationResponse'
    post:
      tags: [CFP]
      summary: Создать CFP рекомендацию
      operationId: createCfpRecommendation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CfpRecommendationUpsertRequest'
      responses:
        '201':
          description: Рекомендация создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfpRecommendationResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/cfp/recommendations/{id}:
    get:
      tags: [CFP]
      summary: Получить CFP рекомендацию по ID
      operationId: findCfpRecommendationById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Рекомендация найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfpRecommendationResponse'
        '404':
          description: Рекомендация не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [CFP]
      summary: Обновить CFP рекомендацию
      operationId: updateCfpRecommendation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CfpRecommendationUpsertRequest'
      responses:
        '200':
          description: Рекомендация обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfpRecommendationResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Рекомендация не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [CFP]
      summary: Удалить CFP рекомендацию (soft delete)
      operationId: deleteCfpRecommendation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Рекомендация удалена
        '404':
          description: Рекомендация не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Media ───────────────────────────────────────────────────────────

  /api/media/upload:
    post:
      tags: [Media]
      summary: Загрузить медиафайл без привязки к лекции
      operationId: uploadStandaloneMedia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Загружаемый файл
      responses:
        '201':
          description: Файл загружен, создана запись с идентификатором и ключом MinIO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMediaUploadResponse'
        '400':
          description: Ошибка загрузки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/media/upload/{lectureId}:
    post:
      tags: [Media]
      summary: Загрузить медиафайл для лекции
      operationId: uploadMedia
      parameters:
        - $ref: '#/components/parameters/MediaLectureId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Загружаемый файл
      responses:
        '201':
          description: Медиафайл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureResponse'
        '400':
          description: Ошибка загрузки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/media/download/{lectureId}:
    get:
      tags: [Media]
      summary: Скачать медиафайл лекции
      operationId: downloadMedia
      parameters:
        - $ref: '#/components/parameters/MediaLectureId'
      responses:
        '200':
          description: Файл для скачивания
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="presentation.pdf"'
        '404':
          description: Лекция не найдена или медиафайл отсутствует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/media/url/{lectureId}:
    get:
      tags: [Media]
      summary: Получить presigned URL медиафайла
      operationId: getPresignedUrl
      parameters:
        - $ref: '#/components/parameters/MediaLectureId'
      responses:
        '200':
          description: Presigned URL
          content:
            text/plain:
              schema:
                type: string
                example: https://minio:9000/lectures-media/...?X-Amz-Signature=...
        '404':
          description: Лекция не найдена или медиафайл отсутствует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/media/{lectureId}:
    delete:
      tags: [Media]
      summary: Удалить медиафайл лекции
      operationId: deleteMedia
      parameters:
        - $ref: '#/components/parameters/MediaLectureId'
      responses:
        '204':
          description: Медиафайл удалён
        '404':
          description: Лекция не найдена или медиафайл отсутствует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/reports/filters:
    get:
      tags: [Reports]
      summary: Получить справочники и опции для фильтров дашбордов
      operationId: getReportFilters
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Справочники для speaker и DevRel dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportFiltersResponse'
        '401':
          description: Пользователь не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/reports/speaker-dashboard/generate:
    post:
      tags: [Reports]
      summary: Сгенерировать JSON-отчёт для дашборда спикера
      operationId: generateSpeakerDashboardReport
      description: Возвращает данные для личного кабинета спикера, включая графики, достижения и рекомендации CFP.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakerDashboardReportRequest'
      responses:
        '200':
          description: Отчёт для speaker dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerDashboardReport'
        '401':
          description: Пользователь не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден или для него ещё нет данных отчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/reports/devrel-dashboard/generate:
    post:
      tags: [Reports]
      summary: Сгенерировать JSON-отчёт для дашборда DevRel
      operationId: generateDevRelDashboardReport
      description: Возвращает агрегаты, рейтинги, blind spots и поток карточек для парсинга мероприятий.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevRelDashboardReportRequest'
      responses:
        '200':
          description: Отчёт для DevRel dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevRelDashboardReport'
        '401':
          description: Пользователь не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Недостаточно прав для DevRel-аналитики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Parsing ─────────────────────────────────────────────────────────

  /api/parsing/run:
    post:
      tags: [Parsing]
      summary: Запустить ИИ-парсинг конференций за дату
      operationId: runConferenceParsing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParsingRunRequest'
      responses:
        '200':
          description: Запрос принят в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsingRunAcceptedResponse'

  /api/parsing/speakers:
    get:
      tags: [Parsing]
      summary: Список спарсенных спикеров
      operationId: listParsedSpeakers
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: Фильтр по дате события
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Спарсенные спикеры
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParsedSpeakerEventResponse'

  /api/parsing/events:
    get:
      tags: [Parsing]
      summary: Список событий парсинга для ревью
      operationId: listParsingEvents
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ParsingStatus'
      responses:
        '200':
          description: События парсинга
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParsingEventRecord'

  /api/parsing/events/{id}:
    patch:
      tags: [Parsing]
      summary: Подтвердить или отклонить событие парсинга
      operationId: patchParsingEvent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParsingEventPatchRequest'
      responses:
        '200':
          description: Обновлённое событие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsingEventRecord'

  # ── Producer ────────────────────────────────────────────────────────

  /api/producer/me/plan:
    get:
      tags: [Producer]
      summary: Последний план продюсера для текущего спикера
      operationId: getMyProducerPlan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Последний сохранённый план (ready, insufficient_data или failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPlanResponse'
        '404':
          description: План ещё не сформирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags: [Producer]
      summary: Собрать новый план продюсера для текущего спикера
      operationId: regenerateMyProducerPlan
      description: >-
        Синхронно: снимок данных спикера → один вызов LLM → проверка доказательств → сохранение.
        Обычно 5–20 секунд. Если данных мало, LLM не вызывается и возвращается статус insufficient_data.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Новый план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPlanResponse'

  /api/producer/speakers/{speakerId}/plan:
    parameters:
      - name: speakerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Producer]
      summary: Последний план продюсера для спикера
      operationId: getSpeakerProducerPlan
      description: SPEAKER — только свой, DEVREL и ADMIN — любой.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Последний сохранённый план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPlanResponse'
        '403':
          description: Спикер запрашивает чужой план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден или план ещё не сформирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags: [Producer]
      summary: Собрать новый план продюсера для спикера
      operationId: regenerateSpeakerProducerPlan
      description: SPEAKER — только свой, DEVREL и ADMIN — любой.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Новый план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPlanResponse'
        '403':
          description: Спикер запрашивает чужой план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/producer/plans/regenerate-all:
    post:
      tags: [Producer]
      summary: Пересобрать планы всех спикеров (DEVREL, ADMIN)
      operationId: regenerateAllProducerPlans
      description: По одному вызову LLM на спикера, не больше app.producer.regenerate-all-limit спикеров.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Новые планы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProducerPlanResponse'

  /api/producer/report:
    get:
      tags: [Producer]
      summary: HTML-отчёт по последним планам спикеров (DEVREL, ADMIN)
      operationId: getProducerReport
      description: Сводка, планы с доказательствами, сверка демо-спикеров с эталоном и всё, что отбросил валидатор.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: HTML-страница
          content:
            text/html:
              schema:
                type: string

components:
  parameters:
    TalkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TalkPathTalkId:
      name: talkId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TalkFeedbackId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LectureId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RoleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    SpeakerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    MediaLectureId:
      name: lectureId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Auth / User ─────────────────────────────────────────────────

    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Уникальный идентификатор пользователя (логин)
          example: johndoe
        password:
          type: string
          format: password
          example: secret123
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          nullable: true
          example: Doe
        surName:
          type: string
          nullable: true
          example: Smith

    RoleName:
      type: string
      enum: [ADMIN, DEVREL, SPEAKER, USER]

    AuthResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: johndoe
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          nullable: true
          example: Doe
        surName:
          type: string
          nullable: true
          example: Smith
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        createdDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time

    AuthTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access-токен
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: Время жизни access в секундах
        refreshToken:
          type: string
        refreshTokenExpiresIn:
          type: integer
          format: int64
          description: Время жизни refresh в секундах
        user:
          $ref: '#/components/schemas/AuthResponse'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UserRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'

    UserRoleUpdateResponse:
      type: object
      required: [userId, roles]
      properties:
        userId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: johndoe
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          nullable: true
          example: Doe
        surName:
          type: string
          nullable: true
          example: Smith
        about:
          type: string
          nullable: true
          example: Java backend developer and conference speaker
        company:
          type: string
          nullable: true
          example: Acme Corp
        companyRole:
          type: string
          nullable: true
          example: Senior Java Engineer
        tags:
          type: array
          items:
            type: string
          example: [java, spring, architecture]
        avatarUrl:
          type: string
          nullable: true
          format: uri
          description: Временная presigned ссылка на аватар в MinIO
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        createdDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time

    # ── Profile ─────────────────────────────────────────────────────

    MeResponse:
      type: object
      properties:
        me:
          $ref: '#/components/schemas/User'
        talks:
          type: array
          items:
            $ref: '#/components/schemas/MeTalkDto'
        cities:
          type: array
          uniqueItems: true
          items:
            type: string
          example: [Не указан]

    ProfilePatchRequest:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: [string, 'null']
          example: John
        lastName:
          type: [string, 'null']
          example: Doe
        surName:
          type: [string, 'null']
          example: Smith
        about:
          type: [string, 'null']
          example: Java backend developer and conference speaker
        company:
          type: [string, 'null']
          example: Acme Corp
        companyRole:
          type: [string, 'null']
          example: Senior Java Engineer
        tags:
          type: [array, 'null']
          items:
            type: string
          example: [java, spring, architecture]
        avatarMediaKey:
          type: [string, 'null']
          writeOnly: true
          description: Input-only ключ объекта в MinIO, полученный после загрузки

    MeTalkDto:
      type: object
      properties:
