  # ── Producer ────────────────────────────────────────────────────────

  /api/producer/me/plan:
    get:
      tags: [Producer]
      summary: Последний план продюсера для текущего спикера
      operationId: getMyProducerPlan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Последний сохранённый план (ready, insufficient_data или failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPlanResponse'
        '404':
          description: План ещё не сформирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags: [Producer]
      summary: Собрать новый план продюсера для текущего спикера
      operationId: regenerateMyProducerPlan
      description: >-
        Синхронно: снимок данных спикера → один вызов LLM → проверка доказательств → сохранение.
        Обычно 5–20 секунд. Если данных мало, LLM не вызывается и возвращается статус insufficient_data.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Новый план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPlanResponse'

  /api/producer/speakers/{speakerId}/plan:
    parameters:
      - name: speakerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Producer]
      summary: Последний план продюсера для спикера
      operationId: getSpeakerProducerPlan
      description: SPEAKER — только свой, DEVREL и ADMIN — любой.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Последний сохранённый план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPlanResponse'
        '403':
          description: Спикер запрашивает чужой план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден или план ещё не сформирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags: [Producer]
      summary: Собрать новый план продюсера для спикера
      operationId: regenerateSpeakerProducerPlan
      description: SPEAKER — только свой, DEVREL и ADMIN — любой.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Новый план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPlanResponse'
        '403':
          description: Спикер запрашивает чужой план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/producer/plans/regenerate-all:
    post:
      tags: [Producer]
      summary: Пересобрать планы всех спикеров (DEVREL, ADMIN)
      operationId: regenerateAllProducerPlans
      description: По одному вызову LLM на спикера, не больше app.producer.regenerate-all-limit спикеров.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Новые планы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProducerPlanResponse'

