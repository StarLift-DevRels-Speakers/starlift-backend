openapi: 3.1.0
info:
  title: Java Speaker Club API
  description: API для управления докладами, лекциями, ролями и медиафайлами спикеров
  version: 2.0.0

servers:
  - url: https://douspeak.duckdns.org:444
    description:
  - url: http://localhost:8080
    description: Локальный запуск

tags:
  - name: Auth
    description: Регистрация и аутентификация
  - name: Profile
    description: Профиль текущего пользователя
  - name: Talks
    description: Управление докладами
  - name: TalkFeedback
    description: Обратная связь по докладам
  - name: Lectures
    description: Управление лекциями
  - name: Roles
    description: Управление ролями спикеров
  - name: Speakers
    description: Поиск спикеров и управление NPS
  - name: Media
    description: Загрузка медиа (в т.ч. без привязки к лекции), скачивание и удаление файлов лекций
  - name: Users
    description: Администрирование ролей пользователей
  - name: Producer
    description: ИИ-продюсер спикера — персональный план по отзывам, докладам и CFP с проверяемыми доказательствами
  - name: Producer · Организатор
    description: ИИ-продюсер для организатора — описать мероприятие, подобрать спикеров с объяснением, пригласить
  - name: Producer · Спикер
    description: ИИ-продюсер для спикера — профиль экспертизы, подбор мероприятий и CFP, ответы на приглашения
  - name: SpeakerTalks
    description: Заготовки докладов спикера (название, тема, описание)
  - name: Feedback
    description: Публичная форма отзыва по ссылке на выступление
  - name: Events
    description: Мероприятия DevRel с CFP
  - name: Applications
    description: Заявки спикеров на CFP
  - name: Invitations
    description: Приглашения DevRel спикерам
  - name: Notifications
    description: Уведомления пользователя
  - name: Catalog
    description: Каталог спикеров для DevRel
  - name: WeakSignals
    description: Оценка потенциала спикера по слабым сигналам через сервис weak-signals
  - name: Gamification
    description: Соревновательный режим спикеров — баллы за активность, недельные лиги, рейтинги и значки

paths:

  # ── Auth ────────────────────────────────────────────────────────────

  /api/auth/sign-on:
    post:
      tags: [Auth]
      summary: Регистрация нового пользователя
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Пользователь зарегистрирован и получил токены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          description: Ошибка регистрации (например, username уже занят)

  /api/auth/sign-in:
    post:
      tags: [Auth]
      summary: Аутентификация пользователя
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Неверные учётные данные

  /api/auth/roles:
    get:
      tags: [Auth]
      summary: Получить список всех доступных ролей
      operationId: listRoles
      responses:
        '200':
          description: Список ролей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleName'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Выход из системы
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh-токен отозван
        '401':
          description: Недействительный refresh-токен

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Обновить пару access/refresh токенов
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Токены обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Refresh-токен недействителен или отозван

  # ── Profile ─────────────────────────────────────────────────────────

  /api/me:
    get:
      tags: [Profile]
      summary: Профиль текущего аутентифицированного пользователя
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль и доклады пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Пользователь не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      tags: [Profile]
      summary: Частично обновить профиль текущего пользователя
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Пользователь не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/users/{userId}/role:
    patch:
      tags: [Users]
      summary: Заменить роль пользователя на одну указанную
      operationId: replaceUserRole
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequest'
      responses:
        '200':
          description: Роль пользователя обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleUpdateResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Пользователь не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Talks ───────────────────────────────────────────────────────────

  /api/talks:
    get:
      tags: [Talks]
      summary: Список всех докладов
      operationId: findAllTalks
      parameters:
        - name: conferenceType
          in: query
          required: false
          description: Фильтр по типу конференции
          schema:
            type: string
      responses:
        '200':
          description: Список докладов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TalkResponse'

    post:
      tags: [Talks]
      summary: Создать новый доклад
      operationId: createTalk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkCreateRequest'
      responses:
        '201':
          description: Доклад создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '400':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{id}:
    get:
      tags: [Talks]
      summary: Получить доклад по ID
      operationId: findTalkById
      parameters:
        - $ref: '#/components/parameters/TalkId'
      responses:
        '200':
          description: Доклад найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [Talks]
      summary: Обновить доклад
      operationId: updateTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkUpdateRequest'
      responses:
        '200':
          description: Доклад обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    patch:
      tags: [Talks]
      summary: Частично обновить доклад
      operationId: patchTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkUpdateRequest'
      responses:
        '200':
          description: Доклад обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [Talks]
      summary: Удалить доклад
      operationId: deleteTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
      responses:
        '204':
          description: Доклад удалён
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{id}/tags:
    post:
      tags: [Talks]
      summary: Добавить теги докладу
      operationId: addTalkTags
      parameters:
        - $ref: '#/components/parameters/TalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkTagsAddRequest'
      responses:
        '200':
          description: Доклад обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{id}/tags/{tag}:
    delete:
      tags: [Talks]
      summary: Удалить тег доклада
      operationId: deleteTalkTag
      parameters:
        - $ref: '#/components/parameters/TalkId'
        - name: tag
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Доклад обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{talkId}/feedback:
    get:
      tags: [TalkFeedback]
      summary: Список обратной связи по докладу
      operationId: findTalkFeedbackByTalkId
      parameters:
        - $ref: '#/components/parameters/TalkPathTalkId'
      responses:
        '200':
          description: Список обратной связи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TalkFeedbackResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    post:
      tags: [TalkFeedback]
      summary: Добавить обратную связь по докладу
      operationId: createTalkFeedback
      parameters:
        - $ref: '#/components/parameters/TalkPathTalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkFeedbackCreateRequest'
      responses:
        '201':
          description: Обратная связь создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkFeedbackResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/talks/{talkId}/feedback/{id}:
    get:
      tags: [TalkFeedback]
      summary: Получить обратную связь по ID в рамках доклада
      operationId: findTalkFeedbackById
      parameters:
        - $ref: '#/components/parameters/TalkPathTalkId'
        - $ref: '#/components/parameters/TalkFeedbackId'
      responses:
        '200':
          description: Обратная связь найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkFeedbackResponse'
        '404':
          description: Доклад или обратная связь не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Lectures ────────────────────────────────────────────────────────

  /api/lectures/by-talk/{talkId}:
    get:
      tags: [Lectures]
      summary: Лекции по ID доклада
      operationId: findLecturesByTalkId
      parameters:
        - name: talkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список лекций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LectureResponse'
        '404':
          description: Доклад не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/lectures/by-speaker/{speakerId}:
    get:
      tags: [Lectures]
      summary: Лекции по ID спикера
      operationId: findLecturesBySpeakerId
      parameters:
        - name: speakerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Список лекций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LectureResponse'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/lectures/{id}:
    get:
      tags: [Lectures]
      summary: Получить лекцию по ID
      operationId: findLectureById
      parameters:
        - $ref: '#/components/parameters/LectureId'
      responses:
        '200':
          description: Лекция найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureResponse'
        '404':
          description: Лекция не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [Lectures]
      summary: Обновить лекцию
      operationId: updateLecture
      parameters:
        - $ref: '#/components/parameters/LectureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LectureUpdateRequest'
      responses:
        '200':
          description: Лекция обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureResponse'
        '404':
          description: Лекция не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [Lectures]
      summary: Удалить лекцию
      operationId: deleteLecture
      parameters:
        - $ref: '#/components/parameters/LectureId'
      responses:
        '204':
          description: Лекция удалена
        '404':
          description: Лекция не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/lectures:
    post:
      tags: [Lectures]
      summary: Создать лекцию
      operationId: createLecture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LectureCreateRequest'
      responses:
        '201':
          description: Лекция создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureResponse'
        '400':
          description: Доклад или спикер не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Roles ───────────────────────────────────────────────────────────

  /api/roles:
    get:
      tags: [Roles]
      summary: Список всех ролей
      operationId: findAllRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список ролей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'

    post:
      tags: [Roles]
      summary: Создать роль
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201':
          description: Роль создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Спикер не найден или роль уже назначена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/roles/by-speaker/{speakerId}:
    get:
      tags: [Roles]
      summary: Роли спикера по его ID
      operationId: findRolesBySpeakerId
      security:
        - bearerAuth: []
      parameters:
        - name: speakerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Список ролей спикера
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'

  /api/roles/{id}:
    delete:
      tags: [Roles]
      summary: Удалить роль
      operationId: deleteRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: Роль удалена
        '404':
          description: Роль не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ── Speakers ────────────────────────────────────────────────────────

  /api/speakers:
    get:
      tags: [Speakers]
      summary: Поиск спикеров по роли и NPS
      operationId: findSpeakersByRole
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          description: Фильтр по названию роли
          schema:
            type: string
        - name: npsMin
          in: query
          required: false
          description: Минимальное значение NPS
          schema:
            type: number
            format: decimal
        - name: npsMax
          in: query
          required: false
          description: Максимальное значение NPS
          schema:
            type: number
            format: decimal
      responses:
        '200':
          description: Список спикеров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpeakerResponse'

  /api/speakers/{id}:
    get:
      tags: [Speakers]
      summary: Получить спикера по ID
      operationId: findSpeakerById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      responses:
        '200':
          description: Спикер найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerResponse'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/speakers/{id}/nps:
    put:
      tags: [Speakers]
      summary: Обновить NPS спикера
      operationId: updateNps
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NpsUpdateRequest'
      responses:
        '200':
          description: NPS обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerResponse'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/speakers/{id}/dashboard-profile:
    patch:
      tags: [Speakers]
      summary: Обновить dashboard-профиль спикера
      description: SPEAKER может обновлять только свой профиль. DEVREL/ADMIN — любой.
      operationId: patchSpeakerDashboardProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakerDashboardProfilePatchRequest'
      responses:
        '200':
          description: Dashboard-профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakerDashboardProfileResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Спикер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/speakers/{id}/nps-history:
    post:
      tags: [Speakers]
      summary: Добавить запись в историю NPS
