      parameters:
        - $ref: '#/components/parameters/MediaLectureId'
      responses:
        '200':
          description: Файл для скачивания
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="presentation.pdf"'
        '404':
          description: Лекция не найдена или медиафайл отсутствует
          content:
            application/json:
              schema:
