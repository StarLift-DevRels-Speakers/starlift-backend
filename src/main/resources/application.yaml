spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: java-speaker-club
  datasource:
    url: jdbc:postgresql://localhost:5432/javaspeakerclub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    gigachat:
      base-url: ${GIGACHAT_BASE_URL:https://api.giga.chat/v1/}
      auth:
        scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
        # Ключ авторизации GigaChat (тот же, что GIGACHAT_TOKEN у weak-signals)
        bearer:
          api-key: ${GIGACHAT_TOKEN:}
        # Сертификаты GigaChat выпущены НУЦ Минцифры (Russian Trusted Root CA), которого нет в truststore JDK.
        # Доверяем ему только в клиенте GigaChat, проверка TLS остаётся включённой
        certs:
          ca-certs: classpath:certs/russian_trusted_root_ca.pem
      chat:
        model: ${GIGACHAT_MODEL:GigaChat-2-Max}

server:
  port: 8080

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:9000}}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  bucket: ${S3_BUCKET:lectures-media}

security:
  jwt:
    issuer: java-speaker-club
    secret: ${JWT_SECRET:change-me}
    access-ttl: 15m
    refresh-ttl: 7d

app:
  parsing:
    search-api-key: ${PARSING_SEARCH_API_KEY}
    serper-url: https://google.serper.dev/search
    scheduled-run-enabled: false
    scheduled-run-cron: "0 0 22 * * *"
    max-pages-per-run: 30
    max-html-chars: 50000
    max-response-bytes: 5242880
    serper-results-per-query: 15
    blocked-domains: []
    request-timeout: 15s
    user-agent: "JavaSpeakerClubBot/1.0"
  producer:
    prompt-version: producer-v1
    temperature: 0.2
    min-theme-mentions: 3
    max-steps: 3
    max-themes-per-kind: 4
    min-feedback-for-plan: 3
    feedback-window-days: 365
    max-feedback-items: 80
    recent-talks-limit: 12
    regenerate-all-limit: 10
  gamification:
    zone: Europe/Moscow
    scheduled-close-enabled: true
    close-cron: "0 5 0 * * MON"
    promotion-count: 3
    demotion-count: 3
    min-participants-for-demotion: 6
    high-rating-threshold: 9
    streak-bonus-every-days: 7
    feedback-daily-cap: 200
    manual-max-abs: 1000
    points:
      talk-created: 50
      feedback-received: 10
      high-rating-feedback: 15
      profile-completed: 100
      daily-check-in: 5
      streak-bonus: 25
  weak-signals:
    base-url: ${WEAK_SIGNALS_BASE_URL:http://localhost:8000}
    request-timeout: 90s
    cfp-high-match-threshold: 70
    recent-talks-limit: 10
    recent-feedback-limit: 20
    achievements-limit: 10
    parsing-events-limit: 10
