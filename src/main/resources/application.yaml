spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: java-speaker-club
  datasource:
    url: jdbc:postgresql://localhost:5432/javaspeakerclub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

server:
  port: 8080

s3:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: lectures-media

security:
  jwt:
    issuer: java-speaker-club
    secret: ${JWT_SECRET:change-me}
    access-ttl: 15m
    refresh-ttl: 7d

app:
  shared-download:
    base-url: ${SHARED_DOWNLOAD_BASE_URL}
  parsing:
    search-api-key: ${PARSING_SEARCH_API_KEY}
    serper-url: https://google.serper.dev/search
    max-pages-per-run: 30
    max-html-chars: 50000
    max-response-bytes: 5242880
    serper-results-per-query: 15
    blocked-domains: []
    request-timeout: 15s
    user-agent: "JavaSpeakerClubBot/1.0"