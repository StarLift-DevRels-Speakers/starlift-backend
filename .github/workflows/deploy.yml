name: Docker Deployment

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # checkout удаляет неотслеживаемые файлы, поэтому секреты лежат на стенде вне рабочей папки
      - name: Provide environment
        run: |
          ENV_FILE="$HOME/starlift/env/backend.env"
          if [ -f "$ENV_FILE" ]; then
            echo "Using the persisted backend environment"
          else
            echo "::warning::$ENV_FILE not found, starting with defaults from docker-compose.yml"
          fi
          python3 tools/audio-analysis/ensure_worker_token.py "$ENV_FILE"
          cp "$ENV_FILE" .env

      - name: Check audio worker configuration
        run: |
          python3 -B -m unittest discover -s tools/audio-analysis -p 'test_*.py'
          docker compose config --quiet

      - name: Build and Restart Docker Containers
        run: |
          docker compose up -d --build
          docker image prune -f

      # Checkout can replace a bind-mounted config inode; recreate nginx to mount
      # the current file and resolve the current app/MinIO container addresses.
      - name: Refresh nginx configuration
        run: |
          docker compose up -d --no-deps --force-recreate nginx
          docker exec java-speaker-club-nginx nginx -t

      # Keep the public API available while a fresh worker downloads its models.
      - name: Wait for services and audio worker readiness
        run: docker compose up -d --wait --wait-timeout 1800

      - name: Audio worker diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=120 audio-worker nginx
