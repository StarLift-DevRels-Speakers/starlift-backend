name: Docker Deployment

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Restart Docker Containers
        run: |
          sudo su
          docker compose up -d --build
          docker image prune -f
