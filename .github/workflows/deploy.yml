name: Docker Deployment

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # checkout удаляет неотслеживаемые файлы, поэтому секреты лежат на стенде вне рабочей папки
      - name: Provide environment
        run: |
          ENV_FILE="$HOME/starlift/env/backend.env"
          if [ -f "$ENV_FILE" ]; then
            cp "$ENV_FILE" .env
          else
            echo "::warning::$ENV_FILE not found, starting with defaults from docker-compose.yml"
          fi

      - name: Build and Restart Docker Containers
        run: |
          docker compose up -d --build
          docker image prune -f
