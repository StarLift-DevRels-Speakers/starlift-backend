apiVersion: v1
kind: ConfigMap
metadata:
  name: speaker-club-config
  namespace: speaker-club
  labels:
    app.kubernetes.io/name: java-speaker-club
data:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/javaspeakerclub
  SPRING_DATASOURCE_USERNAME: postgres
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: lectures-media
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  OPENAI_MODEL: gpt-4o-mini
  OPENAI_BASE_URL: https://api.openai.com
  SHARED_DOWNLOAD_BASE_URL: https://speaker-club.example.com
