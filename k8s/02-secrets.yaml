apiVersion: v1
kind: Secret
metadata:
  name: speaker-club-secrets
  namespace: speaker-club
  labels:
    app.kubernetes.io/name: java-speaker-club
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: postgres
  JWT_SECRET: replace-with-strong-256-bit-secret-before-production
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  OPENAI_API_KEY: replace-with-openai-api-key
  PARSING_SEARCH_API_KEY: replace-with-serper-api-key
  REDIS_PASSWORD: replace-with-redis-password
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: speaker-club
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  POSTGRES_DB: javaspeakerclub
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: speaker-club
  labels:
    app.kubernetes.io/name: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
