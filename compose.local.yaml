# Local Mac stack. Start together with the native Metal worker via tools/audio-analysis/local.sh.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: javaspeakerclub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres
    ports:
      - "127.0.0.1:15439:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d javaspeakerclub"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:19090:9000"
    volumes:
      - media:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "mc alias set local http://minio:9000 minioadmin minioadmin; mc mb --ignore-existing local/lectures-media"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/javaspeakerclub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: local-postgres
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:19090
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      REDIS_HOST: redis
      JWT_SECRET: local-speech-development-secret-change-me-32-bytes
      AUDIO_ANALYSIS_WORKER_TOKEN: ${AUDIO_ANALYSIS_WORKER_TOKEN:?Use tools/audio-analysis/local.sh up}
      # Local speech analysis does not call GigaChat or the external search service.
      GIGACHAT_TOKEN: dummy
      PARSING_SEARCH_API_KEY: not-set
      APP_AUDIENCE_TRIGGERS_ENABLED: "false"
      APP_LIQUIBASE_CONTEXTS: demo
    restart: unless-stopped

  web:
    build:
      context: ${STARLIFT_FRONTEND_DIR:-../starlift-frontend}
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - app
    ports:
      - "127.0.0.1:5174:80"
    volumes:
      - ./tools/audio-analysis/local-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres:
  media:
